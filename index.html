<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mary's TV Guide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* GENERAL */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    #loginScreen, #app {
      max-width: 600px;
      margin: 0 auto;
    }

    /* LOGIN */
    #loginBox {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    #loginBox input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    #loginBtn {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      margin-top: 10px;
      cursor: pointer;
    }

    #loginError {
      color: red;
      margin-top: 10px;
      text-align: center;
    }

    /* FILTER BAR */
    #filterBar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .filter-btn {
      padding: 8px 12px;
      background: #ddd;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-btn.active {
      background: #007bff;
      color: white;
    }

    /* CHANNEL LIST */
    .channel {
      background: white;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      box-shadow: 0 0 5px #ccc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .channel.selected {
      background: #cfe3ff;
      border-left: 5px solid #007bff;
    }

    .channel-info {
      display: flex;
      flex-direction: column;
    }

    .channel-name {
      font-weight: bold;
    }

    .channel-meta {
      font-size: 12px;
      color: #555;
    }

    .favorite-star {
      font-size: 22px;
      cursor: pointer;
      color: #bbb;
    }

    .favorite-star.active {
      color: gold;
    }

    /* VIDEO PLAYER */
    #videoPlayer {
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div id="loginBox">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">Login</button>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none;">

    <!-- VIDEO PLAYER -->
    <div id="videoPlayer" style="display:none;">
      <button id="closeVideoBtn" style="margin-bottom:10px;">Back to Guide</button>
      <iframe id="videoFrame" width="100%" height="250" frameborder="0" allowfullscreen></iframe>
    </div>

    <button id="logoutBtn" style="margin-bottom:15px;">Logout</button>

    <!-- FILTERS -->
    <div id="filterBar">
      <div class="filter-btn active" data-filter="all">All</div>
      <div class="filter-btn" data-filter="basic">Basic</div>
      <div class="filter-btn" data-filter="premium">Premium</div>
      <div class="filter-btn" data-filter="movies247">24/7 Movies</div>
      <div class="filter-btn" data-filter="retro">Retro</div>
    </div>

    <h3>Channels</h3>
    <div id="channelList"></div>

        app.style.display = "block";

    function formatCategory(cat) {
      if (cat === "basic") return "Basic Cable";
      if (cat === "premium") return "Premium";
      if (cat === "movies247") return "24/7 Movie Channel";
      if (cat === "retro") return "Retro TV";
      return "";
    }

    function renderChannels(filter = "all") {
      channelList.innerHTML = "";

      channels.forEach((ch, index) => {
        if (filter !== "all" && ch.category !== filter) return;

        const div = document.createElement("div");
        div.className = "channel";

        div.innerHTML = `
          <div class="channel-info">
            <div class="channel-name">${ch.number} – ${ch.name}</div>
            <div class="channel-meta">${formatCategory(ch.category)}</div>
          </div>
          <span class="favorite-star ${ch.favorite ? "active" : ""}" data-index="${index}">★</span>
        `;

        /* CHANNEL CLICK → HIGHLIGHT + PLAY VIDEO */
        div.addEventListener("click", () => {
          document.querySelectorAll(".channel").forEach(c => c.classList.remove("selected"));
          div.classList.add("selected");

          videoFrame.src = ch.video.replace("watch?v=", "embed/");
          videoPlayer.style.display = "block";
          channelList.style.display = "none";
        });

        channelList.appendChild(div);
      });

      activateFavoriteStars();
    }

    /* FAVORITES */
    function activateFavoriteStars() {
      document.querySelectorAll(".favorite-star").forEach(star => {
        star.addEventListener("click", e => {
          e.stopPropagation();
          const index = e.target.dataset.index;
          channels[index].favorite = !channels[index].favorite;
          e.target.classList.toggle("active");
        });
      });
    }

    /* CLOSE VIDEO */
    document.getElementById("closeVideoBtn").addEventListener("click", () => {
      videoPlayer.style.display = "none";
      videoFrame.src = "";
      channelList.style.display = "block";
    });

    /* FILTER BUTTONS */
    const filterButtons = document.querySelectorAll(".filter-btn");
    let currentFilter = "all";

    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelector(".filter-btn.active").classList.remove("active");
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderChannels(currentFilter);
      });
    });

    /* INITIAL RENDER */
    renderChannels("all");
  </script>
