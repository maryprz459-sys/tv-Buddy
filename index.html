<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My TV Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>
/* GLOBAL */
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* LOADING */
.loading-screen {
  position: fixed;
  inset: 0;
  background: #0d0d0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  animation: fadeOut 0.5s ease forwards;
  animation-delay: 1.8s;
}
.spinner {
  width: 55px;
  height: 55px;
  border: 6px solid #333;
  border-top-color: #1e90ff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}.loading-text {
  margin-top: 15px;
  color: #ccc;
  font-size: 1rem;
  letter-spacing: 1px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

/* LOGIN */
.login-container {
  position: fixed;
  inset: 0;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-box {
  background: #1c1c1c;
  padding: 25px;
  border-radius: 10px;
  width: 300px;
}
.login-box h2 {
  margin-top: 0;
  text-align: center;
}
.login-box label {
  font-size: 0.9rem;
}
login-box input {
  width: 100%;
  padding: 8px;
  margin: 6px 0 12px;
  border-radius: 6px;
  border: none;
.login-box button {
  width: 100%;
  padding: 8px;
  border-radius: 6px;
  border: none;
  background: #1e90ff;
  color: #fff;
  cursor: pointer;
.login-error {
  color: #ff4444;
  margin-bottom: 10px;
  text-align: center;
  min-height: 18px;
}
/* HEADER */
header {
  background: #222;
  padding: 15px;
  font-size: 1.4rem;
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 10;
}
.logout-btn {
  float: right;
  background: #333;
  color: #fff;
  border: 1px solid #444;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
}
/* FILTER BAR */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px;
  background: #181818;
}
.filter-btn {
  background: #333;
  border: none;
  padding: 8px 14px;
  border-radius: 6px;
  color: #fff;
  cursor: pointer;
  font-size: 0.9rem;
}
.filter-btn.active {
  background: #1e90ff;
}
/* CHANNEL LIST */
#channelList {
  padding: 10px;
}
.channel {
  display: flex;
  align-items: center;
  padding: 10px;
  background: #181818;
  border-bottom: 1px solid #333;
  transition: 0.25s;
}
.channel:hover {
  background: #1c1c1c;
  box-shadow: 0 0 12px rgba(255,255,255,0.15);
}
.channel-info {
  display: flex;
  flex-direction: column;
}
.channel-name {
  font-size: 1rem;
  font-weight: bold;
}
.channel-meta {
  font-size: 0.8rem;
  color: #aaa;
}
.favorite-star {
  margin-left: auto;
  font-size: 1.3rem;
  cursor: pointer;
  color: #555;
.favorite-star.active {
  color: #ffd700;
}
/* SMALL SCREEN */
@media (max-width: 600px) {
  .channel-name {
    font-size: 0.95rem;
  }
}
</style>
</head>

<body>


<!-- LOADING SCREEN -->
<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <div class="loading-text">Loading TV Guide...</div>
</div>

<!-- LOGIN SCREEN -->
<div class="login-container" id="loginScreen">
  <div class="login-box">
    <h2>My TV Guide Login</h2>
    <div class="login-error" id="loginError"></div>

    <label for="username">Username</label>
    <input id="username" type="text">

    <label for="password">Password</label>
    <input id="password" type="password">

    <button id="loginBtn">Enter</button>
  </div>
</div>


<!-- MAIN APP -->
<div id="app" style="display:none;">

<header>
  My TV Guide
  <button id="logoutBtn" class="logout-btn">Logout</button>
</header>

<div class="filter-bar">
  <button data-filter="all" class="filter-btn active">All</button>
  <button data-filter="basic" class="filter-btn">Basic</button>
  <button data-filter="premium" class="filter-btn">Premium</button>
  <button data-filter="movies247" class="filter-btn">24/7 Movies</button>
  <button data-filter="retro" class="filter-btn">Retro TV</button>
</div>

<div id="channelList"></div>

</div>

/* LOADING */
window.addEventListener("load", () => {
  const loader = document.getElementById("loadingScreen");
  setTimeout(() => loader.style.display = "none", 2000);
});

/* LOGIN */
const loginBtn = document.getElementById("loginBtn");
const loginScreen = document.getElementById("loginScreen");
const app = document.getElementById("app");
const loginError = document.getElementById("loginError");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");

const VALID_USERNAME = "mary";
const VALID_PASSWORD = "mypassword123";

loginBtn.addEventListener("click", () => {
  const user = usernameInput.value.trim();
  const pass = passwordInput.value;

  if (user === VALID_USERNAME && pass === VALID_PASSWORD) {
    loginScreen.style.display = "none";
    app.style.display = "block";
  } else {
    loginError.textContent = "Invalid username or password.";
  }
});


/* LOGOUT */
const logoutBtn = document.getElementById("logoutBtn");
logoutBtn.addEventListener("click", () => {
  app.style.display = "none";
  loginScreen.style.display = "flex";
  usernameInput.value = "";
  passwordInput.value = "";
  loginError.textContent = "";
});

/* RENDER CHANNELS */
const channelList = document.getElementById("channelList");

function renderChannels(filter = "all") {
  channelList.innerHTML = "";

  channels.forEach((ch, index) => {
    if (filter !== "all" && ch.category !== filter) return;

    const div = document.createElement("div");
    div.className = "channel";

    div.innerHTML = `
      <div class="channel-info">
        <div class="channel-name">${ch.number} – ${ch.name}</div>
        <div class="channel-meta">${formatCategory(ch.category)}</div>
      </div>
      <span class="favorite-star ${ch.favorite ? "active" : ""}" data-index="${index}">★</span>
    `;

    channelList.appendChild(div);
  });

  activateFavoriteStars();
}

function formatCategory(cat) {
  if (cat === "basic") return "Basic Cable";
  if (cat === "premium") return "Premium";
  if (cat === "movies247") return "24/7 Movie Channel";
  if (cat === "retro") return "Retro TV";
  return "";
}

/* FAVORITES */
function activateFavoriteStars() {
  document.querySelectorAll(".favorite-star").forEach(star => {
    star.addEventListener("click", e => {
      const index = e.target.dataset.index;
      channels[index].favorite = !channels[index].favorite;
      e.target.classList.toggle("active");
    });
  });
}


/* FILTER BUTTONS */
const filterButtons = document.querySelectorAll(".filter-btn");
let currentFilter = "all";

filterButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelector(".filter-btn.active").classList.remove("active");
    btn.classList.add("active");

    currentFilter = btn.dataset.filter;
    renderChannels(currentFilter);
  });
});


/* INITIAL RENDER */
renderChannels("all");
