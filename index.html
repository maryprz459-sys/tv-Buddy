<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test TV Guide</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    #loginScreen, #app {
      max-width: 400px;
      margin: 0 auto;
    }

    #loginBox {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }

    #loginBox input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    #loginBtn {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      margin-top: 10px;
      cursor: pointer;
    }

    #loginError {
      color: red;
      margin-top: 10px;
      text-align: center;
    }

    .channel {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
      box-shadow: 0 0 5px #ccc;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    .channel.selected {
      background: #cfe3ff;
      border-left: 5px solid #007bff;
    }

    .favorite-star {
      font-size: 24px;
      cursor: pointer;
      color: #bbb;
    }

    .favorite-star.active {
      color: gold;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div id="loginBox">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button id="loginBtn">Login</button>
      <div id="loginError"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none;">
    <button id="logoutBtn" style="margin-bottom:20px;">Logout</button>
    <h3>Channels</h3>
    <div id="channelList"></div>
  </div>

  <script>
    // LOGIN
    const loginScreen = document.getElementById("loginScreen");
    const app = document.getElementById("app");
    const loginBtn = document.getElementById("loginBtn");
    const loginError = document.getElementById("loginError");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    const VALID_USERNAME = "mary";
    const VALID_PASSWORD = "mypassword123";

    loginBtn.addEventListener("click", () => {
      const user = usernameInput.value.trim();
      const pass = passwordInput.value;

      if (user === VALID_USERNAME && pass === VALID_PASSWORD) {
        loginScreen.style.display = "none";
        app.style.display = "block";
      } else {
        loginError.textContent = "Invalid username or password.";
      }
    });

    // LOGOUT
    document.getElementById("logoutBtn").addEventListener("click", () => {
      app.style.display = "none";
      loginScreen.style.display = "flex";
      usernameInput.value = "";
      passwordInput.value = "";
      loginError.textContent = "";
    });

    // CHANNELS
    const channels = [
      { number: 2, name: "ABC", favorite: false },
      { number: 4, name: "NBC", favorite: false },
      { number: 5, name: "FOX", favorite: false }
    ];

    const channelList = document.getElementById("channelList");

    function renderChannels() {
      channelList.innerHTML = "";
      channels.forEach((ch, index) => {
        const div = document.createElement("div");
        div.className = "channel";
        div.innerHTML = `
          <div>${ch.number} – ${ch.name}</div>
          <span class="favorite-star ${ch.favorite ? "active" : ""}" data-index="${index}">★</span>
        `;

        // highlight on click
        div.addEventListener("click", () => {
          document.querySelectorAll(".channel").forEach(c => c.classList.remove("selected"));
          div.classList.add("selected");
        });

        channelList.appendChild(div);
      });

      activateFavoriteStars();
    }

    function activateFavoriteStars() {
      document.querySelectorAll(".favorite-star").forEach(star => {
        star.addEventListener("click", e => {
          e.stopPropagation(); // don’t break channel click
          const index = e.target.dataset.index;
          channels[index].favorite = !channels[index].favorite;
          e.target.classList.toggle("active");
        });
      });
    }

    renderChannels();
  </script>
</body>
</html>
